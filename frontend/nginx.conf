server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida devolve o index.html para o React Router resolver.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
